name: Bug report
description: Something in Nuvabill does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not report security problems here. Use the security link instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nuvabill version
      description: Shown in the admin area under Updates.
      placeholder: 0.1.2
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: PHP version and database
      placeholder: PHP 8.4, MariaDB 11
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Copy from storage/logs/laravel.log. Remove passwords, keys and client data first.
      render: text
